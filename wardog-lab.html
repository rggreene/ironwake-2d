<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRONWAKE // Wardog lab</title>
<style>
body { background: #182326; color: #dedbd0; font: 16px system-ui; margin: 20px; }
canvas { display: block; width: min(100%, 480px); height: auto; image-rendering: pixelated; background: #293638; }
label { display: block; margin: 12px 0; }
button, select { font: inherit; padding: 8px; }
small { display: block; margin-top: 12px; }
</style>
<h1>SV-2 WARDOG // ART LAB</h1>
<canvas width="192" height="192" aria-label="Animated Wardog preview"></canvas>
<p id="status" role="status">Loading illustrated atlases…</p>
<label>Hull bearing <select id="h"></select></label>
<label>Turret bearing <select id="t"></select></label>
<label>Tracks
<select id="drive">
  <option value="0">Stopped</option>
  <option value="7">Forward</option>
  <option value="-4.55">Reverse</option>
  <option value="5">Pivot cycle</option>
</select>
</label>
<button id="prev">Previous frame</button>
<button id="next">Next frame</button>
<button id="fire" disabled>Fire test</button>
<label><input id="muzzle" type="checkbox"> Show muzzle origin</label>
<output id="readout"></output>
<small>Track and firing controls preview the shipped assets. Lab activity does not affect your game save.</small>
<script type="module">
import { BEARINGS, COOLDOWN, drawCell, loadSheets, pose, wrap } from './wardog-v32.mjs?v=32';

const $ = id => document.getElementById(id);
const ctx = document.querySelector('canvas').getContext('2d');
const center = 96;
let frame = 0;
let last = -Infinity;
let previous = performance.now();
let shot;
for (const id of ['h', 't']) {
    BEARINGS.forEach((name, i) => $(id).add(new Option(name, i)));
    $(id).value = '4';
}
for (const [id, step] of [['prev', -1], ['next', 1]]) {
    $(id).onclick = () => {
        $('drive').value = '0';
        frame = wrap(Math.floor(frame) + step, 4);
    };
}
try {
    const [hull, turret] = await loadSheets();
    $('status').textContent = 'Illustrated atlases loaded · 384 × 192 hull · 384 × 96 turret · nearest-neighbor';
    $('fire').onclick = () => {
        const now = performance.now();
        if (now - last < COOLDOWN * 1000) return;
        last = now;
        shot = pose(+$('h').value, +$('t').value, 0, true);
    };
    function draw(now) {
        const age = (now - last) / 1000;
        frame = wrap(frame + Math.min(.05, (now - previous) / 1000) * +$('drive').value, 4);
        previous = now;
        const current = pose(+$('h').value, +$('t').value, Math.max(0, 1 - age * 7), true);
        ctx.clearRect(0, 0, 192, 192);
        drawCell(ctx, hull, +$('h').value, Math.floor(frame), center - 48, center - 48);
        drawCell(ctx, turret, +$('t').value, current.row, center - 48 + current.x, center - 48 + current.y);
        if ($('muzzle').checked) {
            ctx.fillStyle = '#68f2ff';
            ctx.fillRect(center + current.muzzleX - 1, center + current.muzzleY - 1, 3, 3);
        }
        if (age < .115) {
            ctx.save();
            ctx.translate(center + shot.muzzleX, center + shot.muzzleY);
            ctx.rotate(shot.a);
            ctx.fillStyle = '#ffd391';
            ctx.beginPath();
            ctx.moveTo(-4, 0);
            ctx.lineTo(1, -4);
            ctx.lineTo(13, 0);
            ctx.lineTo(1, 4);
            ctx.fill();
            ctx.restore();
        }
        if (age < .5) {
            ctx.fillStyle = '#777e79';
            ctx.globalAlpha = 1 - age * 2;
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(center + shot.muzzleX + Math.cos(shot.a + i / 3 - .65) * age * (22 + i * 3),
                    center + shot.muzzleY + Math.sin(shot.a + i / 3 - .65) * age * (22 + i * 3), 3, 3);
            }
            ctx.globalAlpha = 1;
        }
        if (age < .32) {
            ctx.fillStyle = '#be995b';
            const offset = 9 + age * 32;
            ctx.fillRect(center + shot.mountX - Math.sin(shot.a) * offset,
                center + shot.mountY + Math.cos(shot.a) * offset, 5, 3);
        }
        $('fire').disabled = age < COOLDOWN;
        $('readout').textContent = 'Track frame ' + (Math.floor(frame) + 1) + '/4 · Turret pose ' +
            (current.row + 1) + '/2 · Cooldown ' + Math.max(0, COOLDOWN - age).toFixed(1) + 's';
        requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
} catch (error) {
    $('status').textContent = 'Illustrated atlas load failed. No preview available. ' + error;
}
</script>
</html>
